[project]
name = "base"
version = "0.0.1"
description = "Base API for all projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.6",
    "openai>=1.75.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.1",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.6",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
